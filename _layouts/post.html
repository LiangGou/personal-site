---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">{{ page.date | date: '%B %-d, %Y' }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</p>
  </header>
  <div class="post-body">
    {{ content }}
  </div>
  <hr>
  {% include subscribe-form.html compact=true %}
</article>
